<!-- Tells the browser to use the modern HTML5 standard. -->
<!DOCTYPE html>
<!-- Wraps the entire page and declares English as its language. -->
<html lang="en">

<head>
    <!-- Sets the character encoding so text displays correctly. -->
    <meta charset="UTF-8">
    <!-- Makes the page size match the device width and starts at normal zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Sets the text shown in the browser tab. -->
    <title>Vrizoil</title>
</head>

<body>

    <!-- The main heading displayed on the page. -->
    <h1>Welcome Vrizoil</h1>

    <!-- A paragraph containing a short message for visitors. -->
    <p>This is the official website of Vrizoil.</p>

</body>

</html>
